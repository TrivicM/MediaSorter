[project]
name = "media-sorter"
version = "1.0.0"
description = "Sort images and videos with EXIF/video metadata, reverse geocoding, duplicate detection, and web GUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pillow>=10.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0",
]

[project.scripts]
media-sorter-gui = "scripting.gui_app:main"
media-sorter = "scripting.metadata_sorter:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["scripting"]

